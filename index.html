<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>إذاعة نبض الإخبارية لمدرسة عمار بن ياسر الابتدائية</title>
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https: http: data: blob:; img-src * 'self' data: blob: https: http: https://*.googleusercontent.com https://drive.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; media-src * 'self' https: http: blob:; connect-src * 'self' https: wss:;">

    <!-- خطوط جوجل المدرسية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Changa:wght@500;700&display=swap" rel="stylesheet">
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --school-navy: #1B365D;    
            --school-green: #2E7D32;   
            --school-gold: #F59E0B;    
            --bg-light: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(27, 54, 93, 0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* حماية حظر تحديد النصوص */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--school-navy), #0F213D);
            color: white;
            padding: clamp(1.2rem, 3.5vw, 2rem) clamp(1rem, 4vw, 2rem);
            text-align: center;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-bottom: 4px solid var(--school-gold);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .header-side-img {
            width: clamp(65px, 12vw, 110px);
            height: clamp(65px, 12vw, 110px);
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid var(--school-gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            flex-shrink: 0;
        }

        .header-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .logo {
            font-family: 'Changa', sans-serif;
            font-size: clamp(1.2rem, 3.2vw, 2.2rem);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 12px;
            width: 100%;
            flex-wrap: wrap;
        }

        .logo i { color: var(--school-gold); }

        .school-subtitle {
            font-size: clamp(0.8rem, 2.2vw, 1.05rem);
            color: #E2E8F0;
            margin-top: 8px;
            font-weight: 400;
            text-align: center;
            width: 100%;
        }

        .developer-badge {
            background: rgba(245, 158, 11, 0.15);
            color: var(--school-gold);
            border: 1px solid var(--school-gold);
            padding: 4px 16px;
            border-radius: 20px;
            font-size: clamp(0.75rem, 1.8vw, 0.95rem);
            font-weight: 700;
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .ticker-wrapper {
            background: var(--card-bg);
            border-bottom: 1px solid #E2E8F0;
            display: flex;
            height: 52px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .ticker-label {
            background: var(--school-green);
            color: white;
            font-weight: 700;
            padding: 0 clamp(10px, 3vw, 25px);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
            font-size: clamp(0.8rem, 2.5vw, 0.95rem);
            white-space: nowrap;
        }

        .ticker-content {
            flex: 1;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .ticker-track {
            white-space: nowrap;
            display: inline-block;
            animation: ticker 35s linear infinite;
        }

        .ticker-track:hover {
            animation-play-state: paused;
        }

        .ticker-item {
            display: inline-block;
            margin-left: 40px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--school-navy);
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 6px;
            transition: background 0.2s ease;
        }

        .ticker-item:hover {
            background: #FEF3C7;
            color: var(--school-green);
        }

        .ticker-item::after {
            content: "🎓";
            margin-right: 40px;
        }

        @keyframes ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .main-container {
            max-width: 100%;
            margin: clamp(1rem, 2vw, 1.5rem) 0;
            padding: 0;
            flex: 1;
            width: 100%;
        }

        /* أزرار التنقل الرئيسية في أعلى بطاقات الصفحة الرئيسية */
        .home-navigation-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 10px 0 20px 0;
            padding: 0 20px;
        }

        .home-nav-btn {
            background: var(--card-bg);
            color: var(--school-navy);
            border: 2px solid var(--school-navy);
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }

        .home-nav-btn:hover {
            background: var(--school-navy);
            color: white;
            transform: translateY(-2px);
        }

        .home-nav-btn:active {
            transform: translateY(0);
        }

        /* حاوية العرض التفاعلي */
        .cards-slider-wrapper {
            width: 100%;
            overflow-x: auto;
            padding: 10px 0 25px 0;
            position: relative;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .cards-slider-wrapper::-webkit-scrollbar {
            display: none;
        }
        .cards-slider-wrapper {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .news-list-track {
            display: flex;
            gap: 25px;
            width: max-content;
            padding: 0 20px;
        }

        .horizontal-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            border: 1px solid #EDF2F7;
            position: relative;
            width: 320px;
            flex-shrink: 0;
        }

        .horizontal-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 30px rgba(27, 54, 93, 0.15);
            border-color: var(--school-gold);
        }

        .card-img-wrap {
            width: 100%;
            height: 200px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            background-color: #e2e8f0;
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .horizontal-card:hover .card-img-wrap img {
            transform: scale(1.05);
        }

        .card-category {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(27, 54, 93, 0.85);
            backdrop-filter: blur(4px);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .card-content {
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.4;
            color: var(--school-navy);
            margin-bottom: 10px;
            cursor: pointer;
            transition: color 0.2s ease;
            word-break: break-word;
        }

        .card-title:hover { color: var(--school-green); }

        .card-excerpt {
            color: var(--text-muted);
            font-size: 0.88rem;
            line-height: 1.6;
            margin-bottom: 15px;
            word-break: break-word;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed #E2E8F0;
            padding-top: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
            flex-wrap: wrap;
            gap: 10px;
            margin-top: auto;
        }

        .read-more-btn {
            color: var(--school-green);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: gap 0.2s ease;
        }

        .read-more-btn:hover { gap: 8px; }

        /* صفحة تفاصيل الخبر */
        .article-page {
            display: none;
            background: var(--card-bg);
            border-radius: 0;
            box-shadow: var(--shadow);
            padding: clamp(20px, 4vw, 40px) clamp(15px, 5vw, 60px);
            width: 100%;
            min-height: 70vh;
            border-top: 3px solid var(--school-navy);
            border-bottom: 3px solid var(--school-navy);
        }

        .back-btn {
            background: var(--bg-light);
            color: var(--school-navy);
            border: 1px solid #CBD5E1;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .back-btn:hover {
            background: var(--school-navy);
            color: white;
            border-color: var(--school-navy);
            transform: translateX(5px);
        }

        .article-title {
            font-size: clamp(1.5rem, 4vw, 2.3rem);
            font-weight: 800;
            color: var(--school-navy);
            margin-bottom: 15px;
            line-height: 1.35;
            word-break: break-word;
        }

        .article-meta {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            border-bottom: 1px solid #E2E8F0;
            padding-bottom: 15px;
        }

        .article-img {
            width: 100%;
            max-height: 520px;
            object-fit: cover;
            border-radius: var(--radius);
            margin-bottom: 25px;
            background-color: #e2e8f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .article-text {
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            line-height: 2.1;
            color: #334155;
            word-break: break-word;
            white-space: pre-line;
        }

        footer {
            background: var(--school-navy);
            color: white;
            margin-top: auto;
            border-top: 5px solid var(--school-gold);
        }

        .footer-content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 25px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .rights-text {
            font-size: 0.95rem;
            color: #E2E8F0;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .header-side-img {
                width: 55px;
                height: 55px;
            }
            .home-nav-btn {
                padding: 8px 16px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <header class="header">
        <img class="header-side-img" src="https://lh3.googleusercontent.com/d/1bmKdhHq0TwB3ek0Xiz2NpdBB-87t-Qdv" alt="اليوم الوطني الـ 96" referrerpolicy="no-referrer">
        
        <div class="header-center">
            <div class="logo">
                <i class="fa-solid fa-radio"></i> إذاعة نبض الإخبارية لمدرسة عمار بن ياسر الابتدائية
            </div>
            <div class="school-subtitle">النافذة الإخبارية والأنشطة المدرسية الرسمية</div>
        </div>

        <img class="header-side-img" src="https://lh3.googleusercontent.com/d/1bmKdhHq0TwB3ek0Xiz2NpdBB-87t-Qdv" alt="اليوم الوطني الـ 96" referrerpolicy="no-referrer">
    </header>

    <div class="ticker-wrapper">
        <div class="ticker-label"><i class="fa-solid fa-bullhorn"></i> أخبار الإذاعة المدرسية</div>
        <div class="ticker-content">
            <div class="ticker-track" id="ticker-track"></div>
        </div>
    </div>

    <div class="main-container">
        <!-- واجهة الصفحة الرئيسية -->
        <div id="home-view">
            <!-- أزرار التحكم في التصفح ببطاقات الصفحة الرئيسية -->
            <div class="home-navigation-bar">
                <button class="home-nav-btn" onclick="scrollNewsList('prev')">
                    <i class="fa-solid fa-chevron-right"></i> الخبر السابق
                </button>
                <button class="home-nav-btn" onclick="scrollNewsList('next')">
                    الخبر التالي <i class="fa-solid fa-chevron-left"></i>
                </button>
            </div>

            <div class="cards-slider-wrapper" id="slider-wrapper">
                <div class="news-list-track" id="news-list"></div>
            </div>
        </div>

        <!-- صفحة عرض تفاصيل الخبر -->
        <div id="article-view" class="article-page">
            <button class="back-btn" onclick="showHome()">
                <i class="fa-solid fa-arrow-right"></i>
                <i class="fa-solid fa-reply"></i> العودة للرئيسية
            </button>
            
            <h1 id="art-title" class="article-title" style="margin-top: 25px;"></h1>
            
            <div class="article-meta">
                <span><i class="fa-regular fa-calendar"></i> <span id="art-date"></span></span>
                <span><i class="fa-solid fa-radio"></i> إذاعة نبض الإخبارية</span>
            </div>
            
            <img id="art-img" class="article-img" src="" alt="صورة الخبر" referrerpolicy="no-referrer">
            
            <div id="art-content" class="article-text"></div>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <p style="font-weight: 700; font-size: 1.1rem;">إذاعة نبض الإخبارية لمدرسة عمار بن ياسر الابتدائية</p>
            <p class="rights-text">جميع الحقوق محفوظة © مدرسة عمار بن ياسر الابتدائية</p>
            <div class="developer-badge">
                <i class="fa-solid fa-code"></i> إعداد وبرمجة أ.صلاح الرحيمان
            </div>
        </div>
    </footer>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxg_jD8qYLIX5iHh4rbSURozU-wgyn2W649LDx4P6Q4hU4RWbaE4dxigfyI4eBvFxovIw/exec';
        const DEFAULT_FALLBACK_IMAGE = 'https://lh3.googleusercontent.com/d/1bmKdhHq0TwB3ek0Xiz2NpdBB-87t-Qdv';

        let cachedNews = [];

        function sanitizeText(str) {
            if (!str) return '';
            const temp = document.createElement('div');
            temp.textContent = str;
            return temp.innerHTML;
        }

        function sanitizeURL(url) {
            if (!url) return DEFAULT_FALLBACK_IMAGE;
            let trimmed = String(url).trim();
            let fileId = null;

            if (trimmed.includes('drive.google.com')) {
                const matchFile = trimmed.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
                if (matchFile && matchFile[1]) {
                    fileId = matchFile[1];
                } else {
                    const matchId = trimmed.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                    if (matchId && matchId[1]) fileId = matchId[1];
                }
            } else if (trimmed.includes('googleusercontent.com/d/')) {
                const matchDirect = trimmed.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (matchDirect && matchDirect[1]) fileId = matchDirect[1];
            }

            if (fileId) return `https://lh3.googleusercontent.com/d/${fileId}`;
            if (trimmed.startsWith('http://') || trimmed.startsWith('https://') || trimmed.startsWith('data:image/')) return trimmed;

            return DEFAULT_FALLBACK_IMAGE;
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function stopSpeaking() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        function normalizeItem(raw, index) {
            if (Array.isArray(raw)) {
                return {
                    id: index,
                    title: raw[2] || raw[1] || raw[0] || 'خبر بدون عنوان',
                    content: raw[4] || raw[3] || raw[1] || 'لا توجد تفاصيل لهذا الخبر.',
                    img: raw[3] || DEFAULT_FALLBACK_IMAGE,
                    date: raw[1] || 'اليوم'
                };
            }
            return {
                id: raw.id || index,
                title: raw.title || raw['العنوان'] || raw['عنوان الخبر'] || raw.Title || raw.name || Object.values(raw)[2] || Object.values(raw)[0] || 'خبر بدون عنوان',
                content: raw.content || raw['المحتوى'] || raw['التفاصيل'] || raw['تفاصيل الخبر'] || raw.Content || raw.details || Object.values(raw)[4] || '',
                img: raw.img || raw['الصورة'] || raw['رابط الصورة'] || raw.image || raw.Img || Object.values(raw)[3] || DEFAULT_FALLBACK_IMAGE,
                date: raw.date || raw['التاريخ'] || raw['تاريخ النشر'] || raw.Date || raw['الطابع الزمني'] || Object.values(raw)[1] || 'اليوم'
            };
        }

        async function fetchNewsFromGoogleSheet() {
            const list = document.getElementById('news-list');
            list.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted); font-weight:700;"><i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل الأخبار...</div>';

            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const rawData = await response.json();
                
                let listData = [];
                if (Array.isArray(rawData)) {
                    listData = rawData;
                } else if (rawData.data && Array.isArray(rawData.data)) {
                    listData = rawData.data;
                } else if (rawData.items && Array.isArray(rawData.items)) {
                    listData = rawData.items;
                }

                cachedNews = listData.map((item, idx) => normalizeItem(item, idx));
                renderInterface();
            } catch (err) {
                console.error('Error fetching news:', err);
                list.innerHTML = '<div style="text-align:center; padding: 40px; color: red; font-weight:700;">تعذر تحميل الأخبار، يرجى التأكد من نشر السكريبت بصلحية Anyone.</div>';
            }
        }

        function createCardElement(item) {
            const cleanTitle = sanitizeText(item.title);
            const cleanImg = sanitizeURL(item.img);
            const cleanContent = sanitizeText(item.content);
            const cleanDate = sanitizeText(item.date || 'اليوم');
            const excerpt = cleanContent.length > 90 ? cleanContent.substring(0, 90) + '...' : cleanContent;

            const card = document.createElement('div');
            card.className = 'horizontal-card';

            card.innerHTML = `
                <div class="card-img-wrap">
                    <span class="card-category">نشاط مدرسي</span>
                    <img src="${cleanImg}" alt="${cleanTitle}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='${DEFAULT_FALLBACK_IMAGE}';">
                </div>
                <div class="card-content">
                    <div>
                        <h3 class="card-title">${cleanTitle}</h3>
                        <p class="card-excerpt">${excerpt}</p>
                    </div>
                    <div class="card-footer">
                        <span><i class="fa-regular fa-clock"></i> ${cleanDate}</span>
                        <span class="read-more-btn">
                            قراءة الخبر <i class="fa-solid fa-arrow-left"></i>
                        </span>
                    </div>
                </div>
            `;

            const imgWrap = card.querySelector('.card-img-wrap');
            const titleEl = card.querySelector('.card-title');
            const readBtn = card.querySelector('.read-more-btn');

            [imgWrap, titleEl, readBtn].forEach(el => {
                el.addEventListener('click', () => openArticle(item.id));
            });

            return card;
        }

        function renderInterface() {
            const list = document.getElementById('news-list');
            const ticker = document.getElementById('ticker-track');
            
            list.innerHTML = '';
            ticker.innerHTML = '';

            if (cachedNews.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted); font-weight:700;">لا توجد أخبار منشورة حالياً.</div>';
                ticker.innerHTML = '<span class="ticker-item">أهلاً بكم في إذاعة نبض الإخبارية لمدرسة عمار بن ياسر الابتدائية</span>';
                return;
            }

            cachedNews.forEach(item => {
                const cleanTitle = sanitizeText(item.title);
                const tickerSpan = document.createElement('span');
                tickerSpan.className = 'ticker-item';
                tickerSpan.textContent = cleanTitle;
                
                tickerSpan.addEventListener('mouseenter', () => speakText(cleanTitle));
                tickerSpan.addEventListener('mouseleave', () => stopSpeaking());
                tickerSpan.addEventListener('click', () => openArticle(item.id));
                ticker.appendChild(tickerSpan);
            });

            /* إضافة كروت الأخبار مرة واحدة فقط دون تكرار */
            cachedNews.forEach(item => {
                list.appendChild(createCardElement(item));
            });
        }

        /* دالة التمرير اليدوي بواسطة أزرار التحكم في الصفحة الرئيسية */
        function scrollNewsList(direction) {
            const wrapper = document.getElementById('slider-wrapper');
            const scrollAmount = 345; // عرض البطاقة مع المسافة
            
            if (direction === 'next') {
                wrapper.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
            } else {
                wrapper.scrollBy({ left: scrollAmount, behavior: 'smooth' });
            }
        }

        function showHome() {
            stopSpeaking();
            document.getElementById('article-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openArticle(id) {
            stopSpeaking();
            const article = cachedNews.find(n => n.id === id);
            
            if (article) {
                const artImg = document.getElementById('art-img');
                document.getElementById('art-title').textContent = article.title;
                artImg.src = sanitizeURL(article.img);
                artImg.onerror = function() {
                    this.onerror = null;
                    this.src = DEFAULT_FALLBACK_IMAGE;
                };
                document.getElementById('art-content').textContent = article.content;
                document.getElementById('art-date').textContent = article.date || 'غير محدد';

                document.getElementById('home-view').style.display = 'none';
                document.getElementById('article-view').style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', function (e) {
            if (
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
                (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's' || e.key === 'A' || e.key === 'a' || e.key === 'P' || e.key === 'p'))
            ) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        });
        document.addEventListener('dragstart', event => event.preventDefault());

        fetchNewsFromGoogleSheet();
    </script>
</body>
</html>
